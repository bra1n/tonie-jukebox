name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # yt-dlp and ffmpeg binaries aren't needed: all YouTube / tonie.cloud calls are mocked
      - run: npm ci --ignore-scripts
      # print the results to the log and also write an lcov report for the summary below
      - run: >-
          npm run coverage --
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
      # show the coverage table on the run's summary page, also when the tests failed
      - if: always()
        run: node scripts/coverage-summary.js lcov.info >> "$GITHUB_STEP_SUMMARY"
