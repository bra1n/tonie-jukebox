name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # yt-dlp and ffmpeg binaries aren't needed: all YouTube / tonie.cloud calls are mocked
      - run: npm ci --ignore-scripts
      - run: npm run coverage
