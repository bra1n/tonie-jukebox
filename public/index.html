<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2a44">
  <title>Tonie Jukebox</title>
  <script>
    // URLs are relative so the app also works in a reverse-proxy sub-directory (e.g. /jukebox/).
    // Opened as "/jukebox" without the trailing slash, they would resolve to "/style.css", "/api/..." etc.,
    // so add it before the stylesheet and script below are requested.
    if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
      history.replaceState(null, '', `${location.pathname}/${location.search}${location.hash}`);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <details class="menu" id="menu">
      <summary aria-label="Account and tonie">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <path d="M3 5h16M3 11h16M3 17h16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </summary>
      <div class="menu-panel">
        <p id="account">Loading account…</p>
        <label>Add songs to
          <select id="tonie"></select>
        </label>
      </div>
    </details>
    <div>
      <h1>Tonie Jukebox</h1>
      <p id="target"></p>
    </div>
  </header>

  <div class="controls">
    <form class="search" id="search-form" role="search">
      <input type="search" id="query" placeholder="Search YouTube" aria-label="Search YouTube" required disabled>
      <button type="submit" class="button" id="search-button" disabled>Search</button>
    </form>
    <div class="options">
      <label><input type="checkbox" id="delete-oldest"> Delete oldest song</label>
      <button type="button" class="button primary" id="upload-button" disabled>Add to tonie</button>
    </div>
    <p class="message" id="space-notice"></p>
    <p class="message" id="status" role="status"></p>
  </div>

  <ul id="results" data-empty="Search for a song, then tap a result to select it."></ul>

  <script src="app.js"></script>
</body>
</html>
